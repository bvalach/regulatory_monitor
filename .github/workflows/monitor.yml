name: regulatory-monitor

on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency: monitor

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Run pipeline
        run: python -m pipeline

      - name: Open data update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain docs/data digests)" ]; then
            branch="automation/regulatory-monitor-data"
            git config user.name "regulatory-monitor bot"
            git config user.email "actions@github.com"
            git switch -c "$branch"
            git add docs/data digests
            git commit -m "Update regulatory monitor data"
            git push --force origin "$branch"

            pr_number="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number')"
            if [ -n "$pr_number" ]; then
              echo "Updated existing pull request #$pr_number."
            else
              gh pr create \
                --base main \
                --head "$branch" \
                --title "Update regulatory monitor data" \
                --body "Actualiza los JSON y digest generados por el monitor regulatorio."
            fi
          else
            echo "No generated data changes."
          fi
