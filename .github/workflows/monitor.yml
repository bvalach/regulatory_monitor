name: regulatory-monitor

on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency: monitor

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Run pipeline
        run: python -m pipeline

      - name: Publish generated data branch
        run: |
          if [ -n "$(git status --porcelain docs/data digests)" ]; then
            branch="automation/regulatory-monitor-data"
            git config user.name "regulatory-monitor bot"
            git config user.email "actions@github.com"
            git switch -c "$branch"
            git add docs/data digests
            git commit -m "Update regulatory monitor data"
            git push --force origin "$branch"

            pr_url="https://github.com/${GITHUB_REPOSITORY}/pull/new/$branch"
            echo "Generated data branch pushed: $branch"
            echo "Open a pull request: $pr_url"
            {
              echo "### Regulatory monitor data update"
              echo ""
              echo "Generated data changes were pushed to \`$branch\`."
              echo ""
              echo "[Open pull request]($pr_url)"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No generated data changes."
          fi
