<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">Flujo del monitor regulatorio</title>
  <desc id="desc">Fuentes públicas, pipeline determinista, datos JSON y GitHub Pages.</desc>
  <rect width="920" height="360" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f7d32"/>
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#202124">
    <rect x="40" y="52" width="150" height="72" rx="8" fill="#e7f3e7" stroke="#b7d8b8"/>
    <text x="115" y="84" text-anchor="middle" font-weight="700">BOE</text>
    <text x="115" y="106" text-anchor="middle" font-size="13">sumarios diarios</text>

    <rect x="40" y="144" width="150" height="72" rx="8" fill="#e6f0f7" stroke="#b3d3e6"/>
    <text x="115" y="176" text-anchor="middle" font-weight="700">EUR-Lex</text>
    <text x="115" y="198" text-anchor="middle" font-size="13">CELLAR SPARQL</text>

    <rect x="40" y="236" width="150" height="72" rx="8" fill="#f0e9f7" stroke="#d2c0e8"/>
    <text x="115" y="268" text-anchor="middle" font-weight="700">EFSA</text>
    <text x="115" y="290" text-anchor="middle" font-size="13">RSS publicaciones</text>

    <rect x="300" y="78" width="210" height="204" rx="8" fill="#f6f7f4" stroke="#d7ded8"/>
    <text x="405" y="112" text-anchor="middle" font-weight="800">Pipeline Python</text>
    <text x="405" y="145" text-anchor="middle">normaliza</text>
    <text x="405" y="176" text-anchor="middle">filtra por términos</text>
    <text x="405" y="207" text-anchor="middle">clasifica por temas</text>
    <text x="405" y="238" text-anchor="middle">deduplica</text>

    <rect x="620" y="88" width="220" height="76" rx="8" fill="#fff3d4" stroke="#ead18a"/>
    <text x="730" y="120" text-anchor="middle" font-weight="700">docs/data/*.json</text>
    <text x="730" y="142" text-anchor="middle" font-size="13">base pública versionada</text>

    <rect x="620" y="196" width="220" height="76" rx="8" fill="#edf1ed" stroke="#d7ded8"/>
    <text x="730" y="228" text-anchor="middle" font-weight="700">GitHub Pages</text>
    <text x="730" y="250" text-anchor="middle" font-size="13">digest + histórico</text>

    <path d="M 190 88 C 230 88, 250 120, 296 136" fill="none" stroke="#2f7d32" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 190 180 L 296 180" fill="none" stroke="#2f7d32" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 190 272 C 230 272, 250 240, 296 224" fill="none" stroke="#2f7d32" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 510 150 L 616 126" fill="none" stroke="#2f7d32" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 730 164 L 730 192" fill="none" stroke="#2f7d32" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
</svg>
